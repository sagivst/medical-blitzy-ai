version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=development
      - CORS_ORIGINS=["http://localhost:3000", "http://frontend:3000"]
    volumes:
      - ./backend:/app
    networks:
      - medical-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=https://medical-blitzy-ai-app-tunnel-ekphct7p.devinapps.com
      - CHOKIDAR_USEPOLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - medical-network

networks:
  medical-network:
    driver: bridge
